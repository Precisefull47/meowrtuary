name: macOS autonomous QA
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: macos-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Apple Silicon
        run: python -c "import platform; assert (platform.system(), platform.machine()) == ('Darwin', 'arm64')"
      - name: Install pinned build tools
        run: python -m pip install -r build-requirements.txt
      - name: Full isolated QA and fresh-package validation
        run: python qa/run.py --allow-missing-external
      - name: Upload reports and logs, never candidate releases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-qa-${{ github.run_id }}
          retention-days: 14
          path: |
            qa/runs/*/report.json
            qa/runs/*/READINESS.md
            qa/runs/*/source-manifest.json
            qa/runs/*/unit.json
            qa/runs/*/qa-unit.json
            qa/runs/*/menu-coverage.json
            qa/runs/*/synthetic.json
            qa/runs/*/clean-release.json
            qa/runs/*/packaged-menus.json
            qa/runs/*/logs/*.log
